dapiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-app-deployment
  labels:
    app: cicd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-app
  template:
    metadata:
      labels:
        app: cicd-app
    spec:
      containers:
      - name: cicd-app
        image: ghostrider412/cicd-app:8bd113b8968c4f9c16bbaa800dce0b037a3d5bfd
        ports:
        - containerPort: 3000